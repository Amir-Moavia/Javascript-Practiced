<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <p>
    <button style="padding: 20px;" onclick=" calculation += '1'; console.log(calculation)">1</button>
    <button style="padding: 20px;"  onclick=" calculation += '2' ; console.log(calculation)">2</button>
    <button style="padding: 20px;" onclick=" calculation += '3' ; console.log(calculation)">3</button>
    <button style="padding: 20px;" onclick=" calculation += ' + ' ; console.log(calculation)">+</button></p>
    <p><button style="padding: 20px;" onclick=" calculation += '4' ; console.log(calculation)">4</button>
    <button style="padding: 20px;" onclick=" calculation += '5' ; console.log(calculation)">5</button>
    <button style="padding: 20px;" onclick=" calculation += '6' ; console.log(calculation)">6</button>
    <button style="padding: 20px;" onclick=" calculation += ' - ' ; console.log(calculation)"> - </button></p>
    <p><button style="padding: 20px;" onclick=" calculation += '7' ; console.log(calculation)">7</button>
    <button style="padding: 20px;" onclick=" calculation += '8' ; console.log(calculation)">8</button>
    <button style="padding: 20px;" onclick=" calculation += '9' ; console.log(calculation)">9</button>
    <button style="padding: 20px;" onclick=" calculation += ' * ' ; console.log(calculation)">*</button></p>

    <script>
        let calculation = ''; 
    </script>
</body>
</html>
