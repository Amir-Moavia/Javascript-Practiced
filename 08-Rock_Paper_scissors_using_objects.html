<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
</head>
<body>
    <p>Rock Paper Scissors Game</p>


    <button onclick="playRound('Rock');">Rock</button> 
    <button onclick="playRound('Paper');">Paper</button> 
    <button onclick="playRound('Scissors');">Scissors</button>
    <button onclick="resetScore();">Reset Score</button>

    <script>
        let Score = JSON.parse(localStorage.getItem('gameScore')) || {
            wins : 0,
            loses : 0,
            ties : 0
        }
        
        function getComputerMove() {
            const randomNumber = Math.floor(Math.random() * 3) + 1;
            if (randomNumber === 1) return 'Rock';
            if (randomNumber === 2) return 'Paper';
            return 'Scissors';
        }

        
        function playRound(playerMove) {
            const computerMove = getComputerMove();
            let result = '';

            if (playerMove === computerMove) {
                result = 'Tie';
                Score.ties++;
            } else if (
                (playerMove === 'Rock' && computerMove === 'Scissors') ||
                (playerMove === 'Paper' && computerMove === 'Rock') ||
                (playerMove === 'Scissors' && computerMove === 'Paper')
            ) {
                result = 'You win';
                Score.wins++;
            } else {
                result = 'You lose';
                Score.loses++;
            }

            localStorage.setItem('gameScore', JSON.stringify(Score));
            
            alert(`You Picked ${playerMove}. Computer Picked ${computerMove}. Result : ${result} \n 
            Wins: ${Score.wins}, Losses: ${Score.loses}, Ties: ${Score.ties}`); 
            

        

        }
        function resetScore()
        {
            Score.wins = 0;
            Score.ties = 0;
            Score.loses = 0;
            localStorage.removeItem('gameScore');
            alert('The Score Has Been Reset');
        }
    </script>
</body>
</html
